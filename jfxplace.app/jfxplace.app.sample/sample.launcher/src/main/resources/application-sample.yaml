emc4j:
  maven:
    directory: ${user.home}/.m2/repository
    redirectionsEnabled: true
    redirect:
      - groupId: com.treilhes.jfxplace
        artifactId: sample.app
        path: ../../../../sample.app/target/classes
      - groupId: com.treilhes.jfxplace
        artifactId: jfxplace\.core\.(?!registry$)(?!starter$)(.*)
        path: ../../../../../../jfxplace.core/jfxplace.core.$1/target/classes
        useRegex: true

server:
  port: 8080

spring:
  h2:
    console:
      enabled: false
  jpa:
    show-sql: true

springdoc:
  show-actuator: true