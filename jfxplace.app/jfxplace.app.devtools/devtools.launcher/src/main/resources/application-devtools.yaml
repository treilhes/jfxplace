emc4j:
  maven:
    directory: ${user.home}/.m2/repository
    redirectionsEnabled: true
    redirect:
      - groupId: com.treilhes.jfxplace
        artifactId: devtools\.(?!registry$)(.*)
        path: ../../../../devtools.$1/target/classes
        useRegex: true

server:
  port: 8080

spring:
  h2:
    console:
      enabled: true
  jpa:
    show-sql: false

springdoc:
  show-actuator: true
  